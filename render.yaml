services:
  - type: web
    name: pac-man-royal
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: pac-man-royal-db
          property: connectionString

databases:
  - name: pac-man-royal-db
    plan: free
    databaseName: pac_man_royal
    user: pac_man_royal
